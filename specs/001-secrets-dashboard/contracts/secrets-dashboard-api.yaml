openapi: 3.1.0
info:
  title: Secrets Management Dashboard API
  version: 0.1.0
  description: >-
    Contract for browsing, viewing, and editing environment variables grouped by
    project, service, and environment.
servers:
  - url: https://{host}
    variables:
      host:
        default: secrets-dashboard.example.com
components:
  securitySchemes:
    entraBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            correlationId:
              type: string
    CurrentUserResponse:
      type: object
      required: [userId, email, roles, allowedProjects]
      properties:
        userId:
          type: string
        email:
          type: string
        roles:
          type: array
          items:
            type: string
        allowedProjects:
          type: array
          items:
            type: string
    ProjectSummary:
      type: object
      required: [projectId, displayName]
      properties:
        projectId:
          type: string
        displayName:
          type: string
    ServiceSummary:
      type: object
      required: [serviceId, displayName, projectId]
      properties:
        serviceId:
          type: string
        projectId:
          type: string
        displayName:
          type: string
    EnvironmentSummary:
      type: object
      required: [environmentId, displayName, projectId, serviceId]
      properties:
        environmentId:
          type: string
        projectId:
          type: string
        serviceId:
          type: string
        displayName:
          type: string
        isProduction:
          type: boolean
    SecretSummary:
      type: object
      required: [name, projectId, serviceId, environmentId, version, updatedAt]
      properties:
        name:
          type: string
        projectId:
          type: string
        serviceId:
          type: string
        environmentId:
          type: string
        version:
          type: string
        updatedAt:
          type: string
          format: date-time
    SecretDetailResponse:
      type: object
      required:
        [name, projectId, serviceId, environmentId, value, version, updatedAt]
      properties:
        name:
          type: string
        projectId:
          type: string
        serviceId:
          type: string
        environmentId:
          type: string
        value:
          type: string
        version:
          type: string
        updatedAt:
          type: string
          format: date-time
        contentType:
          type: string
          nullable: true
        tags:
          type: object
          additionalProperties:
            type: string
    UpdateSecretRequest:
      type: object
      required: [value, expectedVersion]
      properties:
        value:
          type: string
        expectedVersion:
          type: string
    UpdateSecretResponse:
      type: object
      required: [name, version, updatedAt]
      properties:
        name:
          type: string
        version:
          type: string
        updatedAt:
          type: string
          format: date-time
    AuditEvent:
      type: object
      required:
        [eventId, eventType, userId, projectId, serviceId, environmentId,
         variableName, result, timestamp]
      properties:
        eventId:
          type: string
        eventType:
          type: string
          enum: [SecretViewed, SecretEdited]
        userId:
          type: string
        projectId:
          type: string
        serviceId:
          type: string
        environmentId:
          type: string
        variableName:
          type: string
        result:
          type: string
          enum: [Succeeded, Denied, Conflict]
        secretVersion:
          type: string
          nullable: true
        timestamp:
          type: string
          format: date-time
security:
  - entraBearer: []
paths:
  /api/me:
    get:
      summary: Get the current signed-in user context
      responses:
        '200':
          description: Current user context returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/catalog/projects:
    get:
      summary: List projects available to the caller
      responses:
        '200':
          description: Projects returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectSummary'
  /api/catalog/projects/{projectId}/services:
    get:
      summary: List services available in a project
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Services returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServiceSummary'
        '403':
          description: Caller is not authorized for the project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/catalog/projects/{projectId}/services/{serviceId}/environments:
    get:
      summary: List environments available in a service
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
        - name: serviceId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Environments returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EnvironmentSummary'
        '403':
          description: Caller is not authorized for the project or service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/secrets:
    get:
      summary: Browse environment variables in a specific grouping
      parameters:
        - name: projectId
          in: query
          required: true
          schema:
            type: string
        - name: serviceId
          in: query
          required: true
          schema:
            type: string
        - name: environmentId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Secret summaries returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SecretSummary'
        '403':
          description: Caller is not authorized for the grouping
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/secrets/{name}:
    get:
      summary: View a single environment variable in a grouping
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: projectId
          in: query
          required: true
          schema:
            type: string
        - name: serviceId
          in: query
          required: true
          schema:
            type: string
        - name: environmentId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Secret detail returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretDetailResponse'
        '403':
          description: Caller is not authorized for the grouping
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Secret not found in the grouping
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      summary: Update an environment variable in a grouping
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: projectId
          in: query
          required: true
          schema:
            type: string
        - name: serviceId
          in: query
          required: true
          schema:
            type: string
        - name: environmentId
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSecretRequest'
      responses:
        '200':
          description: Secret updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateSecretResponse'
        '403':
          description: Caller is not authorized to edit the grouping
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Version conflict detected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Secret store unavailable; request failed closed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/audit/events:
    get:
      summary: Retrieve secret access and change audit events
      parameters:
        - name: projectId
          in: query
          required: false
          schema:
            type: string
        - name: serviceId
          in: query
          required: false
          schema:
            type: string
        - name: environmentId
          in: query
          required: false
          schema:
            type: string
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Audit events returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditEvent'
        '403':
          description: Caller lacks audit access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
